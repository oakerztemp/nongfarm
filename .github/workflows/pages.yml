# Deploys the static game to GitHub Pages on every push to main (no build step).
# Assumes the repository root is the game folder (the one containing index.html).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests + economy simulator (headless Chrome)
        run: python3 tests/run_tests.py --browser google-chrome

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (game files only)
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js icons vendor _site/
      - name: Version assets (one deploy = one consistent set of files)
        run: python3 .github/scripts/version_assets.py _site "${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
