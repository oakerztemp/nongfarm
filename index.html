<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf6ec">
  <title>ฟาร์มน้องๆ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%A3%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pets.css">
  <link rel="stylesheet" href="css/farm.css">
</head>
<body>
  <div class="app-top">
    <header class="app-header">
      <div class="hdr-farm">
        <span aria-hidden="true">🌾</span>
        <span class="hdr-farm-name" id="hdr-farm-name">ฟาร์มน้องๆ</span>
      </div>
      <div class="hdr-level">
        <span class="hdr-lv" id="hdr-level">Lv.1</span>
        <div class="bar" aria-hidden="true"><div class="bar-fill" id="hdr-xp-fill"></div></div>
        <span class="hdr-xp-text muted" id="hdr-xp-text">0/50</span>
      </div>
      <div class="hdr-right">
        <span class="hdr-coins" title="เหรียญ"><span aria-hidden="true">🪙</span><span id="hdr-coins">0</span></span>
        <span class="save-dot" id="save-dot" data-status="saved" role="status" title="บันทึกในเครื่องแล้ว (Guest)"></span>
        <div class="hdr-user" id="hdr-user"></div>
        <button type="button" class="btn btn-ghost btn-sm hdr-mail" id="mail-btn" aria-label="จดหมาย" title="จดหมาย">📬</button>
        <button type="button" class="btn btn-ghost btn-sm hdr-settings" id="settings-btn" aria-label="ตั้งค่า" title="ตั้งค่า">⚙️</button>
      </div>
    </header>
    <nav class="tab-bar" id="tab-bar" role="tablist" aria-label="เมนูหลัก"></nav>
    <div class="quest-bar" id="quest-bar" hidden></div>
    <div class="tab-banner" id="tab-banner" role="status" hidden>
      <span class="tab-banner-text" id="tab-banner-text">แท็บนี้เป็นแท็บสำรอง — กด 'เล่นที่นี่' เพื่อเล่นต่อ</span>
      <button type="button" class="btn btn-primary btn-sm" id="tab-claim">เล่นที่นี่</button>
    </div>
  </div>

  <main id="view-root" class="view-root">
    <noscript><div class="empty-state">ต้องเปิด JavaScript เพื่อเล่นเกมนี้</div></noscript>
  </main>

  <div class="toast-root" id="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
